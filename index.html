<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portal Google Form</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#ECEFF1;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
    background:#ffffff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.header{
    background:#1976D2;
    color:white;
    padding:30px 20px;
    text-align:center;
}

.header h2{
    font-size:24px;
    margin-bottom:8px;
}

.header p{
    font-size:14px;
    opacity:.9;
}

.menu{
    padding:20px;
}

.menu a{
    display:flex;
    align-items:center;
    gap:15px;
    text-decoration:none;
    background:#F5F7FA;
    color:#333;
    padding:16px;
    margin-bottom:15px;
    border-radius:12px;
    transition:.25s;
    font-weight:500;
    border:1px solid #E0E0E0;
}

.menu a:hover{
    background:#1976D2;
    color:white;
    transform:translateY(-2px);
}

.icon{
    font-size:28px;
}

.footer{
    text-align:center;
    padding:15px;
    background:#F5F5F5;
    font-size:13px;
    color:#666;
}

@media(max-width:480px){

.header h2{
    font-size:22px;
}

.menu a{
    padding:15px;
    font-size:15px;
}

}

</style>

</head>
<body>

<div class="container">

    <div class="header">
        <h2>📋 Portal Google Form</h2>
        <p>Silakan pilih formulir yang ingin Anda isi.</p>
    </div>

    <div class="menu">

        <a href="https://forms.gle/4SAm8AGKARgwWNL67" target="_blank">
            <span class="icon">🎤</span>
            <span>INSTRUMEN WAWANCARA</span>
        </a>

        <a href="https://forms.gle/CDAXWMN8XHeN4L7g6" target="_blank">
            <span class="icon">👨‍🏫</span>
            <span>ANGKET - TUTOR PKBM</span>
        </a>

        <a href="https://forms.gle/S9ZevfYdrf7JJvwr7" target="_blank">
            <span class="icon">👥</span>
            <span>ANGKET - WARGA BELAJAR PKBM</span>
        </a>

    </div>

    <div class="footer">
        Semua formulir akan terbuka di tab baru.
    </div>

</div>

</body>
</html>
